name: Validate project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: test -f Dockerfile && test -f start.sh
      - name: Check shell syntax
        run: bash -n start.sh
      - name: Check for obvious hard-coded secrets
        run: |
          ! grep -Eiq '(password|passwd|secret|token)[[:space:]]*[:=][[:space:]]*[^$"'"'"'[:space:]]+' Dockerfile railway.toml
